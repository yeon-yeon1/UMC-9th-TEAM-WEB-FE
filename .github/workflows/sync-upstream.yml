name: Sync fork with upstream

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://x-access-token:${{ secrets.UPSTREAM_TOKEN }}@github.com/DSWU-UMC-9th/UMC-9th-TEAM-WEB-FE.git || echo "upstream already exists"
          git fetch upstream

      - name: Merge upstream/develop into fork develop
        run: |
          git checkout develop
          # 충돌 없으면 자동으로 머지 커밋 하나 만들어짐
          git merge upstream/develop --no-edit

      - name: Push changes back to fork
        run: |
          git push origin develop