name: Sync fork with upstream

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://x-access-token:${{ secrets.UPSTREAM_TOKEN }}@github.com/DSWU-UMC-9th/UMC-9th-TEAM-WEB-FE.git || echo "upstream already exists"
          git fetch upstream

      - name: Merge upstream/develop into fork develop 
        run: |
          git checkout develop
          git merge upstream/develop --no-edit || echo "Already up to date."

      - name: Push changes back to fork
        run: |
          git push origin develop